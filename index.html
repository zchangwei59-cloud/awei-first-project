<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5eff">
  <title>事故车维修进度记录</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand-mark" aria-hidden="true">修</div>
      <div>
        <h1>事故车维修进度</h1>
        <p>信息清楚，进度随时掌握</p>
      </div>
    </div>
  </header>

  <main>
    <section class="summary" aria-label="维修概览">
      <div><strong id="totalCount">0</strong><span>全部车辆</span></div>
      <div><strong id="repairingCount">0</strong><span>维修中</span></div>
      <div><strong id="doneCount">0</strong><span>已完成</span></div>
    </section>

    <section class="panel form-panel">
      <div class="section-heading">
        <div>
          <span class="eyebrow">新增记录</span>
          <h2 id="formTitle">登记维修车辆</h2>
        </div>
        <button id="cancelEdit" class="text-button" type="button" hidden>取消编辑</button>
      </div>

      <form id="repairForm">
        <section class="ocr-box" aria-labelledby="ocrTitle">
          <div class="ocr-intro">
            <div class="camera-icon" aria-hidden="true">▣</div>
            <div><h3 id="ocrTitle">拍照识别工单</h3><p>图片仅在本机浏览器中识别，不会上传到业务服务器</p></div>
          </div>
          <div class="ocr-pickers">
            <label class="ocr-pick primary-pick">拍摄工单<input id="cameraInput" type="file" accept="image/*" capture="environment"></label>
            <label class="ocr-pick">从相册选择<input id="galleryInput" type="file" accept="image/*"></label>
          </div>
          <div id="ocrEditor" class="ocr-editor" hidden>
            <div class="canvas-wrap"><canvas id="documentCanvas" aria-label="待识别工单预览"></canvas><div id="cropHint" class="crop-hint" hidden>在图片上拖动选择保留区域</div></div>
            <div class="image-tools" aria-label="图片工具">
              <button type="button" id="rotateLeft">↶ 左转</button><button type="button" id="rotateRight">↷ 右转</button>
              <button type="button" id="startCrop">⌗ 裁剪</button><button type="button" id="resetImage">还原</button>
            </div>
            <button type="button" id="recognizeButton" class="recognize-button">开始识别工单</button>
            <div id="ocrProgress" class="ocr-progress" hidden>
              <div class="progress-label"><span id="progressText">正在准备识别…</span><strong id="progressPercent">0%</strong></div>
              <div class="progress-track"><span id="progressBar"></span></div>
            </div>
          </div>
          <div id="ocrNotice" class="ocr-notice" hidden>
            <strong>识别结果已填入，请人工确认</strong>
            <p>手写字、模糊、反光或复杂格式可能识别不准。请逐项检查修改后，再点击页面底部的“保存维修记录”。</p>
          </div>
        </section>
        <input type="hidden" id="recordId">
        <div class="form-grid">
          <label>车牌号 <em>*</em>
            <input id="plateNumber" required maxlength="12" placeholder="例如：粤A·12345" autocomplete="off">
          </label>
          <label>车型 <em>*</em>
            <input id="carModel" required maxlength="30" placeholder="例如：丰田凯美瑞">
          </label>
          <label>工单号 <em>*</em>
            <input id="orderNumber" required maxlength="30" placeholder="例如：WX20260829001">
          </label>
          <label>当前维修状态 <em>*</em>
            <select id="status" required>
              <option value="待定损">待定损</option>
              <option value="待维修">待维修</option>
              <option value="维修中" selected>维修中</option>
              <option value="待配件">待配件</option>
              <option value="待交车">待交车</option>
              <option value="已完成">已完成</option>
            </select>
          </label>
          <label class="full">维修项目
            <textarea id="repairItems" rows="3" maxlength="500" placeholder="填写钣金、喷漆、机修等项目"></textarea>
          </label>
          <label class="full">配件更换情况
            <textarea id="partsReplacement" rows="3" maxlength="500" placeholder="填写已更换、待到货的配件"></textarea>
          </label>
          <label>大灯外修
            <select id="headlightRepair">
              <option value="无">无</option><option value="待送修">待送修</option>
              <option value="外修中">外修中</option><option value="已完成">已完成</option>
            </select>
          </label>
          <label>铝合金外修
            <select id="alloyRepair">
              <option value="无">无</option><option value="待送修">待送修</option>
              <option value="外修中">外修中</option><option value="已完成">已完成</option>
            </select>
          </label>
          <label class="full">备注
            <textarea id="notes" rows="3" maxlength="500" placeholder="填写预计完工时间、客户要求等补充信息"></textarea>
          </label>
        </div>
        <p class="storage-tip">数据仅保存在当前浏览器中，请勿清除浏览器网站数据。</p>
        <button class="primary-button" type="submit"><span aria-hidden="true">＋</span><span id="submitText">保存维修记录</span></button>
      </form>
    </section>

    <section class="records-section">
      <div class="section-heading records-heading">
        <div><span class="eyebrow">维修台账</span><h2>车辆记录</h2></div>
        <span id="recordCount" class="count-pill">0 条</span>
      </div>
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索车牌、车型或工单号" aria-label="搜索维修记录">
      </label>
      <div id="recordsList" class="records-list" aria-live="polite"></div>
      <div id="emptyState" class="empty-state">
        <div aria-hidden="true">🚙</div>
        <h3>暂无维修记录</h3>
        <p>填写上方信息，建立第一条车辆维修记录</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script src="ocr.js"></script>
</body>
</html>
