<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5eff">
  <title>事故车维修进度记录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand-mark" aria-hidden="true">修</div>
      <div>
        <h1>事故车维修进度</h1>
        <p>信息清楚，进度随时掌握</p>
      </div>
    </div>
  </header>

  <main>
    <section class="summary" aria-label="维修概览">
      <div><strong id="totalCount">0</strong><span>全部车辆</span></div>
      <div><strong id="repairingCount">0</strong><span>维修中</span></div>
      <div><strong id="doneCount">0</strong><span>已完成</span></div>
    </section>

    <section class="panel form-panel">
      <div class="section-heading">
        <div>
          <span class="eyebrow">新增记录</span>
          <h2 id="formTitle">登记维修车辆</h2>
        </div>
        <button id="cancelEdit" class="text-button" type="button" hidden>取消编辑</button>
      </div>

      <form id="repairForm">
        <input type="hidden" id="recordId">
        <section class="scan-entry" aria-labelledby="scanTitle">
          <div class="scan-entry__copy">
            <span class="scan-icon" aria-hidden="true">▣</span>
            <div><strong id="scanTitle">拍照识别工单</strong><small>图片仅在本机识别，不会上传</small></div>
          </div>
          <div class="scan-actions">
            <button class="scan-button" id="cameraButton" type="button">拍摄工单</button>
            <button class="scan-button secondary" id="albumButton" type="button">相册选图</button>
          </div>
          <input id="cameraInput" class="visually-hidden" type="file" accept="image/*" capture="environment">
          <input id="albumInput" class="visually-hidden" type="file" accept="image/*">
        </section>
        <div class="form-grid">
          <label>车牌号 <em>*</em>
            <input id="plateNumber" required maxlength="12" placeholder="例如：粤A·12345" autocomplete="off">
          </label>
          <label>车型 <em>*</em>
            <input id="carModel" required maxlength="30" placeholder="例如：丰田凯美瑞">
          </label>
          <label>工单号 <em>*</em>
            <input id="orderNumber" required maxlength="30" placeholder="例如：WX20260829001">
          </label>
          <label>当前维修状态 <em>*</em>
            <select id="status" required>
              <option value="待定损">待定损</option>
              <option value="待维修">待维修</option>
              <option value="维修中" selected>维修中</option>
              <option value="待配件">待配件</option>
              <option value="待交车">待交车</option>
              <option value="已完成">已完成</option>
            </select>
          </label>
          <label class="full">维修项目
            <textarea id="repairItems" rows="3" maxlength="500" placeholder="填写钣金、喷漆、机修等项目"></textarea>
          </label>
          <label class="full">配件更换情况
            <textarea id="partsReplacement" rows="3" maxlength="500" placeholder="填写已更换、待到货的配件"></textarea>
          </label>
          <label>大灯外修
            <select id="headlightRepair">
              <option value="无">无</option><option value="待送修">待送修</option>
              <option value="外修中">外修中</option><option value="已完成">已完成</option>
            </select>
          </label>
          <label>铝合金外修
            <select id="alloyRepair">
              <option value="无">无</option><option value="待送修">待送修</option>
              <option value="外修中">外修中</option><option value="已完成">已完成</option>
            </select>
          </label>
          <label class="full">备注
            <textarea id="notes" rows="3" maxlength="500" placeholder="填写预计完工时间、客户要求等补充信息"></textarea>
          </label>
        </div>
        <p class="storage-tip">数据仅保存在当前浏览器中，请勿清除浏览器网站数据。</p>
        <button class="primary-button" type="submit"><span aria-hidden="true">＋</span><span id="submitText">保存维修记录</span></button>
      </form>
    </section>

    <section class="records-section">
      <div class="section-heading records-heading">
        <div><span class="eyebrow">维修台账</span><h2>车辆记录</h2></div>
        <span id="recordCount" class="count-pill">0 条</span>
      </div>
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索车牌、车型或工单号" aria-label="搜索维修记录">
      </label>
      <div id="recordsList" class="records-list" aria-live="polite"></div>
      <div id="emptyState" class="empty-state">
        <div aria-hidden="true">🚙</div>
        <h3>暂无维修记录</h3>
        <p>填写上方信息，建立第一条车辆维修记录</p>
      </div>
    </section>
  </main>

  <div id="ocrDialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="ocrTitle" hidden>
    <div class="dialog__backdrop" data-close-dialog></div>
    <section class="dialog__panel">
      <div class="dialog__header"><div><span class="eyebrow">本地 OCR</span><h2 id="ocrTitle">调整工单照片</h2></div><button class="close-button" type="button" data-close-dialog aria-label="关闭">×</button></div>
      <div id="imageEditor">
        <p class="editor-tip">拖动蓝色选框选择工单区域；也可先旋转照片。</p>
        <div class="canvas-wrap"><canvas id="ocrCanvas"></canvas><div id="cropBox" class="crop-box" aria-label="裁剪区域"><i></i></div></div>
        <div class="editor-actions">
          <button id="rotateLeft" type="button">↶ 左转</button><button id="rotateRight" type="button">↷ 右转</button>
          <button id="startOcr" class="primary-button compact" type="button">裁剪并开始识别</button>
        </div>
      </div>
      <div id="ocrProgress" class="ocr-progress" hidden>
        <div class="loader" aria-hidden="true"></div><strong id="progressLabel">正在准备中文识别…</strong>
        <div class="progress-track"><span id="progressBar"></span></div><small>首次使用需加载中文识别数据，请保持网络连接；图片始终仅在本机处理。</small>
      </div>
      <div id="ocrResult" hidden>
        <p class="result-tip">请核对识别结果，确认后将自动填写到登记表。已有内容不会被空白结果覆盖。</p>
        <div id="recognizedFields" class="recognized-fields"></div>
        <details><summary>查看识别原文</summary><pre id="rawOcrText"></pre></details>
        <div class="result-actions"><button id="retryOcr" type="button">重新选取</button><button id="applyOcr" class="primary-button compact" type="button">确认并填写</button></div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
